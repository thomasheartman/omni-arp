[package]
name = "omni-arp"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

[workspace]
members = ["xtask"]

[lib]
crate-type = ["cdylib"]

[dependencies]
# Pinned exactly: nice-plug is experimental and its API moves between minor versions.
nice-plug = { version = "=0.4.2", default-features = false, features = ["assert_process_allocs"] }

[dev-dependencies]
# Already pulled in by `assert_process_allocs`; the tests call it directly.
nice-assert-no-alloc = "=1.0.0"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
